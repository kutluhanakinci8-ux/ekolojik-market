name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main, 'cursor/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + wave smokes
        run: npm test

      - name: Build
        run: npm run build

      - name: Pre-release QA (local server)
        run: npm run test:ci
