name: Ekolojik Market POS VPS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'kutluhanakinci8-ux/ekolojik-market'
    steps:
      - name: VPS auth secret kontrolü
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_KEY_B64:-}" ] && [ -z "${VPS_SSH_PASS:-}" ]; then
            echo "::error::Bu repoda Actions secret yok. kutluhanakinci8-ux/ekolojik-market → Settings → Secrets → VPS_SSH_KEY veya VPS_SSH_PASS (org secret ise bu repoya erişim verin)."
            exit 1
          fi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_PASS: ${{ secrets.VPS_SSH_PASS }}

      - name: Kimlik doğrulama modu
        id: auth
        run: |
          if [ -n "${VPS_SSH_KEY:-}" ] || [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${VPS_SSH_PASS:-}" ]; then
            echo "mode=pass" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_PASS: ${{ secrets.VPS_SSH_PASS }}

      - name: SSH anahtarı hazırla
        id: ssh_key
        if: steps.auth.outputs.mode == 'key'
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/vps_deploy_key"
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > "$KEY_FILE"
          else
            printf '%b\n' "${VPS_SSH_KEY:-}" | sed 's/\r$//' > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY geçersiz"
            exit 1
          fi
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}

      - name: Deploy Ekolojik Market POS (SSH key)
        if: steps.auth.outputs.mode == 'key'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST || '168.231.109.27' }}
          username: ${{ secrets.VPS_SSH_USER || 'root' }}
          key_path: ${{ steps.ssh_key.outputs.key_file }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            REPO_ROOT=/var/www/ekolojik-market-pos
            BRANCH=main
            REPO_URL="https://github.com/kutluhanakinci8-ux/ekolojik-market.git"
            if [ ! -d "$REPO_ROOT/.git" ]; then
              git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$REPO_ROOT"
            fi
            export REPO_ROOT BRANCH
            git -C "$REPO_ROOT" fetch origin main
            git -C "$REPO_ROOT" checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
            git -C "$REPO_ROOT" reset --hard origin/main
            bash "$REPO_ROOT/scripts/sunucu-market-pos-deploy.sh"
            echo "Deploy OK: $(git -C "$REPO_ROOT" rev-parse --short HEAD)"

      - name: Deploy Ekolojik Market POS (parola)
        if: steps.auth.outputs.mode == 'pass'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST || '168.231.109.27' }}
          username: ${{ secrets.VPS_SSH_USER || 'root' }}
          password: ${{ secrets.VPS_SSH_PASS }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            REPO_ROOT=/var/www/ekolojik-market-pos
            BRANCH=main
            REPO_URL="https://github.com/kutluhanakinci8-ux/ekolojik-market.git"
            if [ ! -d "$REPO_ROOT/.git" ]; then
              git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$REPO_ROOT"
            fi
            export REPO_ROOT BRANCH
            git -C "$REPO_ROOT" fetch origin main
            git -C "$REPO_ROOT" checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
            git -C "$REPO_ROOT" reset --hard origin/main
            bash "$REPO_ROOT/scripts/sunucu-market-pos-deploy.sh"
            echo "Deploy OK: $(git -C "$REPO_ROOT" rev-parse --short HEAD)"
