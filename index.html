<!DOCTYPE html>
<html lang="tr">
  <head>
    <script>
      (function () {
        if (location.hostname === 'ekolojikmarket.com.tr') {
          location.replace(
            'https://www.ekolojikmarket.com.tr' + location.pathname + location.search + location.hash,
          );
        }
      })();
    </script>
    <script>
      (function () {
        var SYNC_KEY = 'ek-pos-build-sync';
        function go(remoteId) {
          try {
            sessionStorage.setItem(SYNC_KEY, remoteId);
          } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('_build', remoteId);
          location.replace(u.toString());
        }
        fetch('/app-release.json?nocache=' + Date.now(), { cache: 'no-store' })
          .then(function (r) {
            return r.json();
          })
          .then(function (remote) {
            if (!remote || !remote.buildId) return;
            var meta = document.querySelector('meta[name="ek-pos-build"]');
            var embedded = meta ? meta.getAttribute('content') : '';
            if (embedded && embedded === remote.buildId) return;
            var tries = 0;
            try {
              tries = parseInt(sessionStorage.getItem('ek-pos-build-tries') || '0', 10);
            } catch (e) {}
            if (tries > 3) return;
            try {
              sessionStorage.setItem('ek-pos-build-tries', String(tries + 1));
            } catch (e) {}
            go(remote.buildId);
          })
          .catch(function () {});
      })();
    </script>
    <link rel="canonical" href="https://www.ekolojikmarket.com.tr/app" />
    <meta name="ek-pos-build" content="dev" />
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekolojik Market POS — Doğal Ürün Mağazası Yönetimi</title>
    <meta name="description" content="Ekolojik ve doğal ürün mağazaları için bulut tabanlı satış noktası sistemi. Stok, kasa, müşteri ve muhasebe tek platformda." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2d5a27" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
